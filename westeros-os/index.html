<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>وستروس OS</title>
    <meta name="description" content="وستروس OS: نظام تشغيل مطعم وستروس. كاشير، مطبخ مركزي وتصنيع، مخزن، موارد بشرية، مالية وعملاء." />
    <meta name="theme-color" content="#131F34" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="وستروس" />
    <meta name="application-name" content="وستروس" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <script>
      // Theme + language before first paint (no flash). Storage may be blocked → try/catch.
      (function () {
        var pref = "system", lang = "ar";
        try { pref = localStorage.getItem("sufra-os.theme") || "system"; lang = localStorage.getItem("sufra-os.lang") || "ar"; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var h = document.documentElement;
        h.setAttribute("data-theme", dark ? "dark" : "light");
        h.setAttribute("lang", lang === "en" ? "en" : "ar");
        h.setAttribute("dir", lang === "en" ? "ltr" : "rtl");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
